[workspace]
resolver = "2"
members = [
    "pi-notes",               # GUI: view pi message/thinking + browse/store notes
    "pi-mdview",              # GUI: standalone markdown viewer rendered like pi
    "pi-session-inspector",   # CLI: per-session token/cost HTML usage reports
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
